<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kattintgatós Játék</title>
  
  <!-- Új CPAGrip szkript az frissített ID-val -->
  <script type="text/javascript" src="https://quartzfiles.com/script_include.php?id=1917282"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #1a1a2e;
      color: white;
      padding: 20px;
      margin: 0;
    }
    .card {
      background: #16213e;
      padding: 25px;
      border-radius: 15px;
      max-width: 380px;
      margin: 20px auto;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
    }
    h1 { color: #e94560; font-size: 26px; margin-bottom: 10px; }
    h2 { font-size: 22px; color: #f1c40f; }
    p { font-size: 14px; color: #cbd5e1; }
    .btn {
      padding: 14px 20px;
      font-size: 17px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #e94560;
      color: white;
      margin-top: 10px;
      box-shadow: 0 4px 10px rgba(233, 69, 96, 0.4);
      display: inline-block;
      width: 85%;
    }
    .btn:active { transform: scale(0.95); }
    #clickBtn {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      font-size: 22px;
      background: #0f3460;
      border: 4px solid #e94560;
      margin: 20px auto;
      display: block;
      color: white;
    }
    .account-box {
      border: 1px solid #334155;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      background: #0f172a;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Kattintgatós Játék</h1>

    <!-- Regisztráció gomb, ami meghívja a CPAGrip ablakot -->
    <div class="account-box">
      <p>💡 <b>Hozz létre fiókot</b>, hogy el tudd menteni a gyűjtött Coin-jaidat!</p>
      <button class="btn" onclick="openLocker()">Regisztráció</button>
    </div>

    <!-- Játék rész -->
    <div id="game-section">
      <h2>Coinok: <span id="score">0</span> 🪙</h2>
      <button id="clickBtn" class="btn" onclick="addPoint()">KATT!</button>
    </div>
  </div>

  <script>
    let score = 0;

    function addPoint() {
      score++;
      document.getElementById('score').innerText = score;
    }

    // Biztonságos felugró ablak meghívás
    function openLocker() {
      if (typeof call_locker === 'function') {
        call_locker();
      } else {
        alert("A regisztrációs ablak még töltődik, próbáld újra egy pillanat múlva!");
      }
    }
  </script>
</body>
</html>
